<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title data-i18n="optionsTitle">Lingatu Connector</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:480px;margin:32px auto;padding:0 16px;color:#222;}
  h2{margin-bottom:4px;}
  label{display:block;margin-bottom:8px;font-weight:600;}
  input{width:100%;padding:8px;box-sizing:border-box;margin-bottom:12px;font-size:14px;}
  button{padding:8px 16px;cursor:pointer;font-size:14px;}
  p{color:#555;font-size:13px;line-height:1.5;}
  code{background:#f0f0f0;padding:1px 4px;border-radius:3px;}
  #status{margin-top:12px;font-size:13px;min-height:18px;}
  #version{color:#888;font-size:12px;margin:0 0 20px 0;}
</style>
</head>
<body>
  <!-- Los textos los pone options.js desde _locales; aquí solo van los huecos.
       data-i18n-html es para los dos párrafos que llevan <code> dentro: es
       texto propio de la extensión, no dato de nadie. -->
  <h2>Lingatu Connector</h2>
  <p id="version"></p>
  <p data-i18n-html="optionsIntro"></p>
  <p data-i18n-html="optionsLegacy"></p>
  <label for="url" data-i18n="optionsUrlLabel"></label>
  <input id="url" type="text" data-i18n-placeholder="optionsUrlPlaceholder" autocomplete="off">
  <button id="save" data-i18n="optionsSave"></button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
