<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PinBoard</title>

<style>
  :root{
    --bg:#f5f6f8;
    --surface:#ffffff;
    --surface-2:#fafbfc;
    --border:#e2e5ea;
    --text:#1c2029;
    --text-muted:#6b7280;
    --primary:#3d63dd;
    --primary-hover:#2f4fc0;
    --primary-fg:#ffffff;
    --danger:#d64545;
    --danger-hover:#b8332f;
    --success:#1f9d55;
    --success-bg:#e6f7ec;
    --inactive-bg:#f1f2f4;
    --inactive-fg:#8a8f98;
    --tag-bg:#eef1fb;
    --tag-fg:#3d4a8a;
    --tag-active-bg:#3d63dd;
    --tag-active-fg:#ffffff;
    --shadow:0 1px 3px rgba(20,22,30,0.08), 0 1px 2px rgba(20,22,30,0.06);
    --shadow-lg:0 10px 30px rgba(20,22,30,0.18);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161c;
      --surface:#1b1e26;
      --surface-2:#20232c;
      --border:#2c3039;
      --text:#e7e9ee;
      --text-muted:#9aa0ac;
      --primary:#5b7cf0;
      --primary-hover:#7691f5;
      --primary-fg:#0d1017;
      --danger:#e5605c;
      --danger-hover:#f07d79;
      --success:#3ec472;
      --success-bg:#123425;
      --inactive-bg:#262a33;
      --inactive-fg:#6f7684;
      --tag-bg:#242a3d;
      --tag-fg:#a9b6f5;
      --tag-active-bg:#5b7cf0;
      --tag-active-fg:#0d1017;
      --shadow:0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
      --shadow-lg:0 10px 30px rgba(0,0,0,0.5);
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--primary);}
  .app{
    display:grid;
    grid-template-columns:270px 1fr;
    min-height:100vh;
  }
  /* Sidebar */
  .sidebar{
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:20px 16px;
    display:flex;
    flex-direction:column;
    gap:22px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
    min-width:0;
  }
  .sidebar h1{
    font-size:18px;
    margin:0 0 4px 0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .sidebar-section h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--text-muted);
    margin:0 0 10px 0;
    font-weight:600;
  }
  .category-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .category-item{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:7px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    color:var(--text);
    user-select:none;
  }
  .category-item:hover{background:var(--surface-2);}
  .category-item.active{background:var(--primary);color:var(--primary-fg);}
  .category-item .count{
    font-size:12px;
    color:var(--text-muted);
    background:var(--surface-2);
    border-radius:999px;
    padding:1px 7px;
    min-width:20px;
    text-align:center;
    margin-top:1px;
    flex-shrink:0;
  }
  .category-item.active .count{background:rgba(255,255,255,0.25);color:var(--primary-fg);}
  .category-item.dragging{opacity:0.4;}
  .category-item.drag-over{outline:2px dashed var(--primary);outline-offset:-2px;}

  .tag-cloud{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .tag-chip{
    font-size:12px;
    padding:4px 9px;
    border-radius:999px;
    background:var(--tag-bg);
    color:var(--tag-fg);
    cursor:pointer;
    border:1px solid transparent;
    white-space:nowrap;
  }
  .tag-chip:hover{border-color:var(--primary);}
  .tag-chip.active{background:var(--tag-active-bg);color:var(--tag-active-fg);outline:2px solid var(--primary);outline-offset:1px;}
  .tag-chip.excluded{background:var(--surface-2);color:var(--text-muted);text-decoration:line-through;outline:2px solid var(--danger);outline-offset:1px;opacity:0.75;}
  .tag-empty{font-size:13px;color:var(--text-muted);}

  .view-profile-list{display:flex;flex-wrap:wrap;gap:6px;}
  .view-profile-chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:12px;
    padding:4px 6px 4px 10px;
    border-radius:999px;
    background:var(--tag-bg);
    color:var(--tag-fg);
    border:1px solid transparent;
    cursor:pointer;
    white-space:nowrap;
  }
  .view-profile-chip:hover{border-color:var(--primary);}
  .view-profile-chip.active{background:var(--tag-active-bg);color:var(--tag-active-fg);outline:2px solid var(--primary);outline-offset:1px;}
  .view-profile-chip-remove{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:14px;
    height:14px;
    border-radius:50%;
    color:inherit;
    opacity:0.7;
  }
  .view-profile-chip-remove:hover{opacity:1;background:rgba(0,0,0,0.12);}

  .cat-color-dot{
    display:inline-block;
    width:9px;
    height:9px;
    border-radius:50%;
    flex-shrink:0;
  }
  .cat-icon{width:14px;height:14px;flex-shrink:0;}
  .icon-picker{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    padding:8px;
    flex-basis:100%;
    width:100%;
    background:var(--surface);
    border-radius:8px;
    border:1px solid var(--border);
  }
  .icon-picker button{
    display:flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:28px;
    padding:0;
    border:1px solid transparent;
    border-radius:6px;
    background:var(--surface);
    color:var(--text-muted);
  }
  .icon-picker button:hover{border-color:var(--border);color:var(--text);}
  .icon-picker button.active{border-color:var(--primary);color:var(--primary);}
  .icon-picker button .cat-icon{width:16px;height:16px;}
  .manage-row-icon-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:22px;
    height:22px;
    padding:0;
    border:1px solid var(--border);
    border-radius:5px;
    background:var(--surface);
    color:var(--text-muted);
    flex-shrink:0;
  }
  .manage-row-icon-btn:hover{color:var(--text);}
  .color-swatch-dot{display:block;width:14px;height:14px;border-radius:50%;}
  .color-swatch-btn{
    width:26px;
    height:26px;
    padding:0;
    border:1px solid transparent;
    border-radius:50%;
  }
  .color-swatch-btn.active{outline:2px solid var(--primary);outline-offset:2px;}
  .cat-name-wrap{
    display:flex;
    align-items:center;
    gap:7px;
    flex:1 1 auto;
    min-width:0;
    white-space:normal;
    overflow-wrap:anywhere;
  }

  .data-actions{
    margin-top:auto;
    display:flex;
    gap:8px;
  }
  .data-actions button{flex:1;}

  .app-footer{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding-top:12px;
    border-top:1px solid var(--border);
    font-size:12px;
    color:var(--text-muted);
    text-align:center;
  }
  .app-footer a{color:var(--text-muted);text-decoration:none;}
  .app-footer a:hover{color:var(--primary);text-decoration:underline;}

  /* Buttons */
  button{
    font-family:inherit;
    font-size:13px;
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    cursor:pointer;
  }
  button:hover{filter:brightness(0.97);}
  @media (prefers-color-scheme: dark){ button:hover{filter:brightness(1.15);} }
  .btn-primary{
    background:var(--primary);
    color:var(--primary-fg);
    border-color:var(--primary);
    font-weight:600;
    width:100%;
    padding:10px 12px;
  }
  .btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);}
  .btn-danger{color:var(--danger);border-color:var(--danger);background:transparent;}
  .btn-danger:hover{background:var(--danger);color:#fff;}

  /* Main content */
  .content{padding:24px 28px;max-width:1200px;min-width:0;}
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
  }
  #searchInput{
    flex:1;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:14px;
  }
  #resultCount{font-size:13px;color:var(--text-muted);white-space:nowrap;}

  .status-toggle{
    display:flex;
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    flex-shrink:0;
  }
  .status-toggle-btn{
    border:none;
    border-radius:0;
    background:var(--surface);
    padding:9px 14px;
    font-size:13px;
    color:var(--text-muted);
  }
  .status-toggle-btn + .status-toggle-btn{border-left:1px solid var(--border);}
  .status-toggle-btn.active{background:var(--primary);color:var(--primary-fg);font-weight:600;}

  .links-groups{
    display:flex;
    flex-direction:column;
    gap:28px;
  }
  .category-group-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:15px;
    font-weight:700;
    margin:0 0 12px 0;
    color:var(--text);
    cursor:pointer;
    user-select:none;
  }
  .group-toggle-arrow{
    display:inline-block;
    font-size:11px;
    color:var(--text-muted);
    transition:transform 0.15s ease;
  }
  .category-group.collapsed .group-toggle-arrow{transform:rotate(-90deg);}
  .category-group.collapsed .links-grid,
  .category-group.collapsed .links-list{display:none;}
  .category-group-title.drag-over{outline:2px dashed var(--primary);outline-offset:4px;border-radius:6px;}
  .category-group-count{
    font-size:12px;
    font-weight:600;
    color:var(--text-muted);
    background:var(--surface-2);
    border-radius:999px;
    padding:1px 8px;
  }
  .links-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:14px;
  }

  .links-list{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .link-card-compact{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 10px;
  }
  .link-card-compact.inactive{opacity:0.55;}
  .link-card-compact{cursor:grab;}
  .link-card-compact.dragging{opacity:0.4;}
  .link-card-compact.drag-over{outline:2px dashed var(--primary);outline-offset:2px;}
  .compact-title{
    flex:1;
    min-width:0;
    font-size:13px;
    color:var(--text);
    text-decoration:none;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .compact-title:hover{text-decoration:underline;}
  .compact-tags{
    display:flex;
    gap:4px;
    flex-shrink:0;
    max-width:240px;
    overflow:hidden;
  }
  .compact-tags .tag{white-space:nowrap;flex-shrink:0;}
  .link-card-compact .card-icon-actions{flex-shrink:0;}
  .link-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-top-width:4px;
    border-radius:var(--radius);
    padding:12px 14px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .link-card.inactive{opacity:0.6;}
  .link-card{cursor:grab;}
  .link-card.dragging{opacity:0.4;}
  .link-card.drag-over{outline:2px dashed var(--primary);outline-offset:2px;}
  .bridge-highlight{animation:bridgeFlash 2s ease-out;}
  @keyframes bridgeFlash{
    0%,30%{outline:2px solid var(--primary);outline-offset:2px;background:var(--surface-2);}
    100%{outline:2px solid transparent;outline-offset:2px;}
  }
  .card-header{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:8px;
  }
  .card-icon-actions{display:flex;gap:2px;flex-shrink:0;}
  .icon-action-plain{
    background:transparent;
    border:none;
    padding:3px 5px;
    font-size:14px;
    line-height:1;
    color:var(--text-muted);
  }
  .icon-action-plain:hover{color:var(--text);background:transparent;}
  .icon-action-plain.icon-danger:hover{color:var(--danger);}
  .icon-disabled{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:3px 5px;
    font-size:14px;
    line-height:1;
    color:var(--text-muted);
    opacity:0.25;
  }
  .favicon{
    width:16px;
    height:16px;
    border-radius:3px;
    vertical-align:middle;
    flex-shrink:0;
  }
  .link-card h3 .favicon{margin-right:6px;}
  .link-card h3{margin:0;font-size:15px;line-height:1.35;}
  .link-card h3 a{color:var(--text);text-decoration:none;word-break:break-word;}
  .link-card h3 a:hover{text-decoration:underline;}
  .link-card .url{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .description{font-size:13px;color:var(--text-muted);margin:0;white-space:pre-wrap;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tags .tag{
    font-size:11px;
    padding:2px 8px;
    border-radius:999px;
    background:var(--tag-bg);
    color:var(--tag-fg);
    cursor:pointer;
  }
  .empty-state{
    text-align:center;
    color:var(--text-muted);
    padding:60px 20px;
    font-size:14px;
  }

  /* Modo selección múltiple (acciones en lote) */
  .card-select{
    width:15px;
    height:15px;
    margin:0;
    flex-shrink:0;
    cursor:pointer;
    accent-color:var(--primary);
  }
  /* Empuja las acciones ▲▼✏️🗑️ a la derecha en la vista cómoda, sin cambiar
     el justify-content de .card-header (que con un solo hijo se comportaría
     al revés de lo que parece). */
  .card-header .card-select{margin-right:auto;}
  .selection-mode .link-card,
  .selection-mode .link-card-compact{cursor:pointer;}
  /* En modo selección, ▲▼✏️🗑️ se ocultan: un clic en cualquier parte de la
     ficha alterna la selección, así que no puede haber zonas que hagan otra cosa. */
  .selection-mode .card-icon-actions{display:none;}
  .link-card.selected,
  .link-card-compact.selected{
    outline:2px solid var(--primary);
    outline-offset:1px;
    background:var(--surface-2);
  }
  .selection-bar{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:8px;
    max-width:calc(100% - 32px);
    padding:10px 14px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--surface);
    box-shadow:var(--shadow-lg);
    z-index:60;
  }
  /* Necesario como en los overlays: .selection-bar{display:flex} (CSS de autor)
     pisaría al display:none nativo del atributo hidden. */
  .selection-bar[hidden]{display:none;}
  .selection-count{font-size:13px;font-weight:600;white-space:nowrap;margin-right:4px;}

  /* Indicación visual al arrastrar un archivo (marcadores) sobre la página entera,
     mismo lenguaje visual que .drag-over (contorno discontinuo en var(--primary)). */
  .file-drop-indicator{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(61,99,221,0.12);
    border:3px dashed var(--primary);
    pointer-events:none;
  }
  .file-drop-indicator.visible{display:flex;}
  .file-drop-indicator span{
    background:var(--surface);
    color:var(--text);
    padding:10px 20px;
    border-radius:var(--radius);
    box-shadow:var(--shadow-lg);
    font-weight:600;
  }

  /* Modal */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(10,12,18,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
  }
  .modal-overlay[hidden]{display:none;}
  .modal{
    background:var(--surface);
    border-radius:14px;
    padding:24px;
    width:100%;
    max-width:440px;
    box-shadow:var(--shadow-lg);
    max-height:90vh;
    overflow-y:auto;
  }
  .modal h2{margin:0 0 16px 0;font-size:17px;}
  /* Más ancho que el resto de modales: la fila de categoría acumula color,
     icono, orden ▲/▼ y acciones; a 440px se ve forzada a partirse en dos líneas. */
  #manageModalOverlay .modal{max-width:560px;}
  /* El modal de enlace es el doble de ancho que el resto: el formulario va a dos
     columnas, con las notas ocupando la derecha entera. Es lo que evita que un
     campo que puede crecer mucho deje el modal con scroll. */
  #modalOverlay .modal{max-width:880px;}
  #linkForm{display:flex;flex-direction:column;gap:12px;}
  .form-columns{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .form-column{display:flex;flex-direction:column;gap:12px;min-width:0;}
  /* La columna de notas se estira hasta el alto de la otra y el textarea ocupa
     todo lo que sobra, sea cual sea el número de campos de la izquierda. */
  .form-column-notes,.form-column-notes label{height:100%;}
  #fieldNotes{flex:1;min-height:280px;}
  /* Con poco ancho no caben dos columnas: se apilan, y las notas vuelven a un
     alto moderado para no empujar los botones fuera de la vista. */
  @media (max-width: 940px){
    .form-columns{grid-template-columns:1fr;}
    .form-column-notes,.form-column-notes label{height:auto;}
    #fieldNotes{min-height:140px;}
  }
  #linkForm label{
    display:flex;
    flex-direction:column;
    gap:5px;
    font-size:13px;
    font-weight:600;
    color:var(--text-muted);
  }
  #linkForm input:not([type=checkbox]),#linkForm textarea{
    font-family:inherit;
    font-size:14px;
    font-weight:400;
    color:var(--text);
    padding:9px 11px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface-2);
  }
  #linkForm textarea{resize:vertical;}

  /* Editor de chips del campo Etiquetas */
  .tags-field{ position:relative; }
  .tags-chips-wrap{
    display:flex; flex-wrap:wrap; align-items:center; gap:6px;
    padding:6px 8px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); cursor:text;
  }
  .tags-chips-wrap:focus-within{ border-color:var(--primary); outline:2px solid var(--primary); outline-offset:1px; }
  .tags-chip{ cursor:default; display:inline-flex; align-items:center; gap:5px; padding:3px 4px 3px 9px; }
  .tags-chip-remove{
    display:inline-flex; align-items:center; justify-content:center;
    width:16px; height:16px; padding:0; border:none; border-radius:50%;
    background:transparent; color:inherit; font-size:13px; line-height:1; cursor:pointer; opacity:0.7;
  }
  .tags-chip-remove:hover{ opacity:1; background:rgba(0,0,0,0.12); }
  .tags-chip-remove:focus-visible{ outline:2px solid var(--primary); outline-offset:1px; opacity:1; }
  #linkForm .tags-chips-wrap .tags-input{
    flex:1 1 80px; min-width:80px; border:none; background:transparent;
    padding:4px 2px; font-family:inherit; font-size:14px; font-weight:400; color:var(--text);
  }
  .tags-input:focus{ outline:none; }
  .tags-suggestions{
    position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:5;
    margin:0; padding:4px; list-style:none;
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    box-shadow:var(--shadow-lg); max-height:180px; overflow-y:auto;
  }
  .tags-suggestions[hidden]{ display:none; }
  .tags-suggestion{ padding:6px 9px; border-radius:6px; font-size:13px; color:var(--text); cursor:pointer; }
  .tags-suggestion:hover,.tags-suggestion.active{ background:var(--tag-active-bg); color:var(--tag-active-fg); }
  /* Paleta de comandos (Ctrl+K). Mismo overlay que los modales, pero anclada
     arriba: la lista crece hacia abajo sin mover el campo de búsqueda. */
  .palette-overlay{align-items:flex-start;padding-top:10vh;}
  .palette{max-width:560px;padding:14px;display:flex;flex-direction:column;gap:10px;}
  .palette-input{
    width:100%;
    font-family:inherit;
    font-size:15px;
    color:var(--text);
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface-2);
  }
  .palette-input:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary);}
  .palette-results{
    margin:0;padding:0;list-style:none;
    max-height:52vh;overflow-y:auto;
  }
  .palette-results[hidden]{display:none;}
  .palette-group{
    padding:8px 9px 4px 9px;
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;
    color:var(--text-muted);
  }
  .palette-item{
    display:flex;align-items:center;gap:8px;
    padding:7px 9px;border-radius:6px;
    font-size:14px;color:var(--text);cursor:pointer;
  }
  .palette-item:hover,.palette-item.active{background:var(--tag-active-bg);color:var(--tag-active-fg);}
  .palette-item-label{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .palette-item-meta{
    flex:0 0 auto;max-width:45%;
    font-size:12px;color:var(--text-muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .palette-item.active .palette-item-meta{color:inherit;opacity:0.85;}
  .palette-hint{
    flex:0 0 auto;
    padding:1px 6px;border-radius:5px;
    border:1px solid var(--border);background:var(--surface-2);
    font-size:11px;font-family:inherit;color:var(--text-muted);
  }
  .palette-empty{margin:0;padding:8px 9px;font-size:13px;color:var(--text-muted);}
  .palette-empty[hidden]{display:none;}
  .checkbox-label{
    flex-direction:row !important;
    align-items:center;
    gap:8px !important;
  }
  .checkbox-label input{width:auto;}
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:6px;
  }
  #btnDuplicate{margin-right:auto;}
  /* .btn-primary es de ancho completo (lo pide "+ Nuevo enlace" del lateral);
     en un modal de 880px eso deja un botón "Guardar" desproporcionado. */
  #linkForm .modal-actions .btn-primary{width:auto;min-width:140px;}
  .field-error{font-size:12px;color:var(--danger);font-weight:400;display:none;}

  /* Título del sitio */
  .site-title{display:flex;align-items:center;gap:8px;}
  .site-title h1{margin:0;overflow-wrap:anywhere;flex:1;}
  .app-icon{width:24px;height:24px;border-radius:6px;flex-shrink:0;}
  .icon-btn{
    background:transparent;
    border:none;
    padding:4px 6px;
    font-size:14px;
    line-height:1;
    color:var(--text-muted);
    flex-shrink:0;
  }
  .icon-btn:hover{color:var(--text);background:transparent;}

  /* Cabeceras de sección con acción de gestión */
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .section-header h2{margin:0;}
  .section-header-actions{display:flex;align-items:center;gap:2px;}
  .link-btn{
    background:transparent;
    border:none;
    padding:0;
    font-size:12px;
    font-weight:600;
    color:var(--primary);
  }
  .link-btn:hover{text-decoration:underline;background:transparent;}

  /* Modal de gestión de categorías/etiquetas */
  .manage-list{
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:55vh;
    overflow-y:auto;
    margin-bottom:14px;
  }
  .manage-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--surface-2);
  }
  .manage-row-name{font-size:13px;display:flex;align-items:center;gap:8px;word-break:break-word;}
  .manage-row-color{
    width:22px;
    height:22px;
    padding:0;
    border:1px solid var(--border);
    border-radius:5px;
    background:none;
    cursor:pointer;
    flex-shrink:0;
  }
  .manage-row-color-reset{padding:2px 4px;font-size:12px;flex-shrink:0;}
  .manage-row-count{
    font-size:11px;
    color:var(--text-muted);
    background:var(--surface);
    border-radius:999px;
    padding:1px 7px;
    flex-shrink:0;
  }
  .manage-row-actions{display:flex;gap:6px;flex-shrink:0;}
  .manage-row-actions button{font-size:12px;padding:5px 9px;}
  .manage-row-actions .icon-action-plain,
  .manage-row-actions .icon-disabled{padding:5px 6px;font-size:13px;}
  .manage-row-edit-input{
    flex:1;
    min-width:0;
    padding:6px 9px;
    border-radius:6px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:13px;
  }
  .manage-add-form{display:flex;gap:8px;margin-bottom:4px;}
  .manage-add-form input{
    flex:1;
    padding:9px 11px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    font-size:14px;
  }

  @media (max-width: 780px){
    .app{grid-template-columns:1fr;}
    .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border);}
    .compact-tags{display:none;}
  }
</style>
</head>

      <h1 id="siteTitleDisplay">PinBoard</h1>
      <button type="button" id="btnEditTitle" class="icon-btn" title="Cambiar título de la página">✏️</button>
    </div>
    <button id="btnAdd" class="btn-primary" title="Crear un enlace nuevo (atajo: n)">+ Nuevo enlace</button>

    <div class="sidebar-section">
      <div class="section-header">
        <h2>Categorías</h2>
        <button type="button" id="btnManageCategories" class="link-btn" title="Renombrar, reordenar, colorear y eliminar categorías">Gestionar</button>

      <button id="btnImport" title="Importar enlaces desde un archivo JSON">Importar</button>

    <div class="app-footer" id="appFooter"></div>

  <main class="content">
    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Buscar por título, descripción, etiqueta o nota..." title="Busca en título, descripción, etiquetas y notas (atajo: /)">
      <div class="status-toggle" id="statusToggle">
        <button type="button" class="status-toggle-btn" data-value="all" title="Muestra todos los enlaces, activos e inactivos">Todos</button>
        <button type="button" class="status-toggle-btn" data-value="active" title="Muestra solo los enlaces activos">Activos</button>
      </div>
      <div class="status-toggle" id="viewToggle">
        <button type="button" class="status-toggle-btn" data-value="comfortable" title="Vista en fichas de cuadrícula">Cómoda</button>
        <button type="button" class="status-toggle-btn" data-value="compact" title="Vista en lista compacta">Compacta</button>
      </div>
      <button type="button" id="btnToggleAllGroups" class="link-btn" style="white-space:nowrap;" title="Plegar o expandir todas las categorías de golpe">Plegar todo</button>
      <button type="button" id="btnSelectionMode" class="link-btn" style="white-space:nowrap;" title="Activar el modo selección para aplicar acciones a varios enlaces a la vez">Seleccionar</button>
      <button type="button" id="btnCommandPalette" class="link-btn" style="white-space:nowrap;" title="Buscar enlaces, categorías, vistas, etiquetas y acciones (atajo: Ctrl+K)">Comandos (Ctrl+K)</button>
      <span id="resultCount"></span>
    </div>
    <div id="linksContainer" class="links-groups"></div>
    <p id="emptyState" class="empty-state" hidden>No se encontraron enlaces con los filtros actuales.</p>
    <div id="selectionBar" class="selection-bar" role="toolbar" aria-label="Acciones sobre los enlaces seleccionados" hidden>
      <span id="selectionCount" class="selection-count"></span>
      <button type="button" data-action="bulk-add-tag" title="Añadir una etiqueta a todos los enlaces seleccionados">+ Etiqueta</button>
      <button type="button" data-action="bulk-remove-tag" title="Quitar una etiqueta de los enlaces seleccionados que la tengan">− Etiqueta</button>
      <button type="button" data-action="bulk-category" title="Asignar una categoría a todos los enlaces seleccionados (se crea si no existía)">Categoría</button>
      <button type="button" data-action="bulk-activate" title="Marcar como activos todos los enlaces seleccionados">Activar</button>
      <button type="button" data-action="bulk-deactivate" title="Marcar como inactivos todos los enlaces seleccionados">Desactivar</button>
      <button type="button" data-action="bulk-create-view" title="Guardar los enlaces seleccionados como una vista reutilizable (no se aplica ahora ni pierdes la selección)">Crear vista</button>
      <button type="button" data-action="bulk-delete" class="btn-danger" title="Eliminar los enlaces seleccionados (irreversible)">Eliminar</button>

<div id="modalOverlay" class="modal-overlay" hidden>

      <input type="hidden" id="linkId">
      <div class="form-columns">
        <div class="form-column">
          <label>Categoría *
            <input id="fieldCategory" list="categoryOptions" required autocomplete="off">
          </label>
          <datalist id="categoryOptions"></datalist>

          <label>Título *
            <input id="fieldTitle" required autocomplete="off">
          </label>

          <label>Link *
            <input id="fieldUrl" type="url" required placeholder="https://ejemplo.com" autocomplete="off">
          </label>

          <label>Descripción
            <textarea id="fieldDescription" rows="2"></textarea>
          </label>

          <label for="tagsInput">Etiquetas <span style="font-weight:400">(escribe y pulsa Enter, espacio o coma; también puedes pegar varias de golpe)</span>
            <div id="tagsField" class="tags-field">
              <div id="tagsChipsWrap" class="tags-chips-wrap">
                <input id="tagsInput" type="text" class="tags-input" autocomplete="off"
                       placeholder="Añadir etiqueta..." aria-label="Añadir etiqueta"
                       role="combobox" aria-autocomplete="list" aria-expanded="false"
                       aria-controls="tagsSuggestions" aria-haspopup="listbox">
              </div>
              <ul id="tagsSuggestions" class="tags-suggestions" role="listbox" hidden></ul>

<div id="manageModalOverlay" class="modal-overlay" hidden>

      <button type="submit" class="btn-primary">Añadir</button>

      <button type="button" id="btnExportCategories" title="Exportar categorías (nombre, icono, color y posición) a un archivo JSON" hidden>Exportar</button>

    <p id="commandPaletteEmpty" class="palette-empty" hidden>Sin resultados.</p>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "enlaces_links_v1";
  var CATEGORIES_KEY = "enlaces_categories_v1";
  var TAGS_KEY = "enlaces_tags_v1";
  var TITLE_KEY = "enlaces_site_title_v1";
  var VIEW_MODE_KEY = "enlaces_view_mode_v1";
  var COLLAPSED_KEY = "enlaces_collapsed_categories_v1";
  var CATEGORY_COLORS_KEY = "enlaces_category_colors_v1";
  var TAG_COLORS_KEY = "enlaces_tag_colors_v1";
  var CATEGORY_ICONS_KEY = "enlaces_category_icons_v1";
  var EXCLUDED_TAGS_KEY = "enlaces_excluded_tags_v1";
  var VIEW_PROFILES_KEY = "enlaces_view_profiles_v1";

  // Identidad de la app: versión visible y créditos. Editable a mano aquí.
  var APP_CONFIG = {
    version: "1.7.0",
    siteName: "NLevia.org",
    siteUrl: "https://www.nlevia.org",
    repoUrl: "https://github.com/alvama/PinBoard"
  };

  var state = {
    links: [],
    categories: [],
    allTags: [],
    siteTitle: "PinBoard",
    viewMode: "comfortable",
    collapsedCategories: new Set(),
    categoryColors: {},
    categoryIcons: {},
    tagColors: {},
    selectedCategories: new Set(),
    tags: new Set(),
    excludedTags: new Set(),
    // Enlaces a los que limita la vista aplicada, cuando es una vista de
    // selección (4.17). Vacío = sin límite. No se persiste ni tiene ningún
    // control propio en la UI: su único origen es applyViewProfile().
    viewLinkIds: new Set(),
    viewProfiles: [],
    // Nombre de la vista aplicada, o null. Se rastrea explícitamente en vez de
    // derivarse comparando etiquetas: si dos vistas se guardan con la misma
    // selección (o ninguna), comparar por coincidencia las marcaría a la vez
    // como activas y el clic para desmarcar dejaría de tener efecto.
    activeViewProfile: null,
    activeFilter: "active",
    search: "",
    // Modo selección y enlaces seleccionados: viven solo en memoria, nunca en
    // localStorage — recuperar al abrir la app una selección hecha ayer sería
    // desconcertante y peligroso (acciones en lote sobre lo que ya no miras).
    selectionMode: false,
    selectedLinks: new Set()
  };

  var editingId = null;

  // ---------- Persistencia ----------
  function load(){
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      try{ return JSON.parse(raw); }catch(e){ return null; }
    }
    return null;
  }

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.links));
  }

  function loadCategories(){
    var raw = localStorage.getItem(CATEGORIES_KEY);
    if(raw){ try{ return JSON.parse(raw); }catch(e){ return []; } }
    return [];
  }
  function saveCategories(){
    localStorage.setItem(CATEGORIES_KEY, JSON.stringify(state.categories));
  }

  function loadAllTags(){
    var raw = localStorage.getItem(TAGS_KEY);
    if(raw){ try{ return JSON.parse(raw); }catch(e){ return []; } }
    return [];
  }
  function saveAllTags(){
    localStorage.setItem(TAGS_KEY, JSON.stringify(state.allTags));
  }

  function loadSiteTitle(){
    return localStorage.getItem(TITLE_KEY) || "PinBoard";
  }
  function saveSiteTitle(){
    localStorage.setItem(TITLE_KEY, state.siteTitle);
  }

  function loadViewMode(){
    var v = localStorage.getItem(VIEW_MODE_KEY);
    return (v === "compact" || v === "comfortable") ? v : "comfortable";
  }
  function saveViewMode(){
    localStorage.setItem(VIEW_MODE_KEY, state.viewMode);
  }

  function loadCollapsedCategories(){
    var raw = localStorage.getItem(COLLAPSED_KEY);
    if(raw){ try{ return new Set(JSON.parse(raw)); }catch(e){ return new Set(); } }
    return new Set();
  }
  function saveCollapsedCategories(){
    localStorage.setItem(COLLAPSED_KEY, JSON.stringify(Array.from(state.collapsedCategories)));
  }

  // Etiquetas excluidas de la vista: a diferencia de state.tags (inclusión,
  // se resetea en cada carga), esto se fija hasta que el usuario lo desmarque.
  function loadExcludedTags(){
    var raw = localStorage.getItem(EXCLUDED_TAGS_KEY);
    if(raw){ try{ return new Set(JSON.parse(raw)); }catch(e){ return new Set(); } }
    return new Set();
  }
  function saveExcludedTags(){
    localStorage.setItem(EXCLUDED_TAGS_KEY, JSON.stringify(Array.from(state.excludedTags)));
  }

  // Perfiles de vista guardados: { name, tags, excludedTags, selectedCategories, linkIds }.
  // Independientes de los enlaces y de las listas maestras — borrar uno no
  // afecta a nada más. Tampoco hay purga de ids de enlaces ya borrados: un id
  // que no coincide con nada simplemente no aporta enlaces a la vista.
  function loadViewProfiles(){
    var raw = localStorage.getItem(VIEW_PROFILES_KEY);
    if(!raw) return [];
    try{
      var parsed = JSON.parse(raw);
      // Compatibilidad con perfiles guardados antes de incluir también las
      // etiquetas incluidas, antes de incluir las categorías, y antes de
      // existir las vistas por selección de enlaces.
      return parsed.map(function(p){
        return {
          name: p.name,
          tags: Array.isArray(p.tags) ? p.tags : [],
          excludedTags: Array.isArray(p.excludedTags) ? p.excludedTags : [],
          selectedCategories: Array.isArray(p.selectedCategories) ? p.selectedCategories : [],
          linkIds: Array.isArray(p.linkIds) ? p.linkIds : []
        };
      });
    }catch(e){ return []; }
  }
  function saveViewProfiles(){
    localStorage.setItem(VIEW_PROFILES_KEY, JSON.stringify(state.viewProfiles));
  }

  function loadCategoryColors(){

  function genId(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,9);
  }

  // ---------- Utilidades ----------
  function escapeHtml(str){
    return String(str == null ? "" : str).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // Favicon vía el servicio público de Google (a partir del dominio de la URL).
  // Si la URL es inválida, no se muestra ningún icono.
  function faviconUrl(url){
    try{
      var host = new URL(url).hostname;
      return "https://www.google.com/s2/favicons?sz=32&domain=" + encodeURIComponent(host);
    }catch(e){
      return null;
    }
  }

  function faviconImgHtml(url){
    var src = faviconUrl(url);
    if(!src) return "";
    return '<img class="favicon" src="' + escapeHtml(src) + '" alt="" loading="lazy" onerror="this.remove()">';
  }

  // Dominio para mostrar bajo el título en la vista cómoda. Cadena vacía si la URL no es válida.
  function hostnameForDisplay(url){
    try{ return new URL(url).hostname; }catch(e){ return ""; }
  }

  function normalizeTags(raw){
    if(!raw) return [];
    var parts = raw.split(/[\s,]+/).map(function(t){ return t.trim(); }).filter(Boolean);
    var seen = new Set();
    var out = [];
    parts.forEach(function(t){
      var clean = "#" + t.replace(/^#+/, "");
      var key = clean.toLowerCase();
      if(clean.length > 1 && !seen.has(key)){
        seen.add(key);
        out.push(clean);
      }
    });
    return out;
  }

  // ---------- Notas por enlace ----------
  // Las notas se acumulan: cada anotación entra como un bloque nuevo al final,
  // encabezado por su fecha, y nunca se sobrescribe lo anterior (ver 4.23).
  // El texto se guarda tal cual —el Markdown es una convención de escritura,
  // no un formato de salida—, así que aquí no se renderiza nada.
  function formatNoteBlock(text){
    var d = new Date();
    var stamp = String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + d.getFullYear();
    return "## " + stamp + "\n\n" + String(text == null ? "" : text).replace(/\s+$/, "");
  }

  // Añade un bloque al final del texto de notas existente, con una línea en
  // blanco de separación y sin espacios sobrantes al final.
  function appendNoteToText(existing, block){
    var base = String(existing == null ? "" : existing).replace(/\s+$/, "");
    return base ? base + "\n\n" + block : block;
  }

  // Cuenta los bloques con encabezado de fecha. Lo devuelve appendNote para que
  // la extensión pueda decir "3 notas en este enlace" al confirmar: ver subir el
  // número es lo que evita repetir la captura creyendo que no funcionó.
  function countNoteBlocks(text){
    var found = String(text == null ? "" : text).match(/^## /gm);
    return found ? found.length : 0;
  }

  // Devuelve el nombre canónico ya existente (comparación sin distinguir mayúsculas)
  // o registra "name" como nueva categoría si no existía.
  function ensureCategory(name){
    name = (name || "").trim();
    if(!name) return name;
    var existing = state.categories.find(function(c){ return c.toLowerCase() === name.toLowerCase(); });
    if(existing) return existing;
    state.categories.push(name);
    return name;
  }

  function ensureTag(tag){
    var existing = state.allTags.find(function(t){ return t.toLowerCase() === tag.toLowerCase(); });
    if(existing) return existing;
    state.allTags.push(tag);
    return tag;
  }

  // El orden de categorías es manual (posición en state.categories, ver
  // swapCategories), no alfabético — mismo criterio que el orden de enlaces.
  function getCategories(){
    var counts = {};
    state.links.forEach(function(l){
      counts[l.category] = (counts[l.category] || 0) + 1;
    });
    return state.categories.map(function(c){
      return { name: c, count: counts[c] || 0 };
    });
  }

  // Intercambia la posición de dos categorías por nombre (reordenación manual con ▲/▼).
  function swapCategories(nameA, nameB){
    var idxA = state.categories.indexOf(nameA);
    var idxB = state.categories.indexOf(nameB);
    if(idxA === -1 || idxB === -1) return;
    var tmp = state.categories[idxA];
    state.categories[idxA] = state.categories[idxB];
    state.categories[idxB] = tmp;
    saveCategories();
    renderManageList();
    render();
  }

  // Mueve una categoría a la posición justo antes de "beforeName" (o al final
  // si es null). Arrastrar y soltar en la lista del sidebar (ver más abajo).
  function moveCategoryTo(draggedName, beforeName){
    var idx = state.categories.indexOf(draggedName);
    if(idx === -1) return;
    state.categories.splice(idx, 1);
    var targetIdx = beforeName ? state.categories.indexOf(beforeName) : -1;
    if(targetIdx === -1) state.categories.push(draggedName);
    else state.categories.splice(targetIdx, 0, draggedName);
    saveCategories();
    render();
  }

  function getAllTags(){
    return state.allTags.slice().sort(function(a,b){ return a.localeCompare(b); });
  }

  // El orden de state.links es el orden manual del usuario dentro de cada categoría
  // (ver swapLinks). No se reordena aquí para respetarlo.
  function getFilteredLinks(){
    var q = state.search.trim().toLowerCase();
    return state.links.filter(function(l){
      if(state.viewLinkIds.size > 0 && !state.viewLinkIds.has(l.id)) return false;
      if(state.selectedCategories.size > 0 && !state.selectedCategories.has(l.category)) return false;
      if(state.activeFilter === "active" && !l.active) return false;
      if(state.tags.size > 0){
        var hasTag = l.tags.some(function(t){ return state.tags.has(t); });
        if(!hasTag) return false;
      }
      if(state.excludedTags.size > 0){
        var hasExcluded = l.tags.some(function(t){ return state.excludedTags.has(t); });
        if(hasExcluded) return false;
      }
      if(q){
        var haystack = (l.title + " " + (l.description||"") + " " + l.tags.join(" ") + " " + (l.notes||"")).toLowerCase();
        if(haystack.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  // Exportar: sin categoría/etiquetas/enlaces seleccionados, exporta todo. Con
  // alguna selección (categoría, etiquetas incluidas o excluidas, o la lista de
  // enlaces de una vista por selección — vistas son solo un atajo para fijar
  // estas mismas), exporta únicamente esos enlaces.
  // A propósito no tiene en cuenta la búsqueda de texto ni el toggle
  // Todos/Activos, para que ese filtro momentáneo no recorte una exportación.
  function hasLinkSelection(){
    return state.selectedCategories.size > 0 || state.tags.size > 0 || state.excludedTags.size > 0 || state.viewLinkIds.size > 0;
  }
  function getLinksForExport(){
    if(!hasLinkSelection()) return state.links;
    return state.links.filter(function(l){
      if(state.viewLinkIds.size > 0 && !state.viewLinkIds.has(l.id)) return false;
      if(state.selectedCategories.size > 0 && !state.selectedCategories.has(l.category)) return false;
      if(state.tags.size > 0){
        var hasTag = l.tags.some(function(t){ return state.tags.has(t); });
        if(!hasTag) return false;
      }
      if(state.excludedTags.size > 0){
        var hasExcluded = l.tags.some(function(t){ return state.excludedTags.has(t); });
        if(hasExcluded) return false;
      }
      return true;
    });
  }

  function normalizeUrlForCompare(url){
    return String(url || "").trim().replace(/\/+$/, "").toLowerCase();
  }

  function findDuplicateUrl(url, excludeId){
    var normalized = normalizeUrlForCompare(url);
    return state.links.find(function(l){
      if(l.id === excludeId) return false;
      return normalizeUrlForCompare(l.url) === normalized;
    });
  }

  function swapLinks(idA, idB){
    var idxA = state.links.findIndex(function(l){ return l.id === idA; });
    var idxB = state.links.findIndex(function(l){ return l.id === idB; });
    if(idxA === -1 || idxB === -1) return;
    var tmp = state.links[idxA];
    state.links[idxA] = state.links[idxB];
    state.links[idxB] = tmp;
    save();
    render();
  }

  // Mueve un enlace (por drag & drop) a una categoría, insertado justo antes de "beforeId"
  // (o al final de esa categoría si beforeId es null). Permite tanto reordenar dentro de
  // una misma categoría como cambiar de categoría arrastrando a otro grupo.
  function moveLinkTo(draggedId, targetCategory, beforeId){
    var idx = state.links.findIndex(function(l){ return l.id === draggedId; });
    if(idx === -1) return;
    var link = state.links.splice(idx, 1)[0];
    link.category = ensureCategory(targetCategory);
    if(beforeId && beforeId !== draggedId){
      var targetIdx = state.links.findIndex(function(l){ return l.id === beforeId; });
      state.links.splice(targetIdx === -1 ? state.links.length : targetIdx, 0, link);
    } else {
      var lastIdx = -1;
      state.links.forEach(function(l, i){ if(l.category === link.category) lastIdx = i; });
      state.links.splice(lastIdx + 1, 0, link);
    }
    save();
    saveCategories();
    render();
  }

  // ---------- Selección múltiple y acciones en lote ----------

  function linkCountText(n){
    return n + " enlace" + (n === 1 ? "" : "s");
  }

  function toggleLinkSelection(id){
    if(state.selectedLinks.has(id)) state.selectedLinks.delete(id);
    else state.selectedLinks.add(id);
    render();
  }

  function setSelectionMode(on){
    state.selectionMode = on;
    // Salir del modo devuelve las fichas exactamente a su comportamiento anterior.
    state.selectedLinks.clear();
    render();
  }

  // Cualquier cambio en lo que se está viendo (filtro de categoría, etiquetas,
  // estado, búsqueda, vista guardada o modo de vista) vacía la selección: nunca
  // se debe poder aplicar una acción en lote a enlaces que ya no están a la vista.
  function clearSelectionOnViewChange(){
    state.selectedLinks.clear();
  }

  function getSelectedLinks(){
    return state.links.filter(function(l){ return state.selectedLinks.has(l.id); });
  }

  // Todas las acciones en lote recorren la selección, mutan state.links y
  // guardan UNA sola vez al final (no una vez por enlace), como cualquier otra
  // operación de la app: estado -> save() -> render().
  function bulkAddTag(){
    var links = getSelectedLinks();
    if(links.length === 0) return;
    var raw = prompt("Etiqueta que añadir a los " + linkCountText(links.length) + " seleccionados:");
    if(raw === null) return;
    var tags = normalizeTags(raw).map(ensureTag);
    if(tags.length === 0) return;
    links.forEach(function(l){
      tags.forEach(function(t){
        var has = l.tags.some(function(x){ return x.toLowerCase() === t.toLowerCase(); });
        if(!has) l.tags.push(t);
      });
    });
    save();
    saveAllTags();
    render();
  }

  function bulkRemoveTag(){
    var links = getSelectedLinks();
    if(links.length === 0) return;
    var raw = prompt("Etiqueta que quitar de los " + linkCountText(links.length) + " seleccionados:");
    if(raw === null) return;
    // Resolución de solo lectura: quitar una etiqueta de unos enlaces no la
    // borra de la lista maestra, ni registra una nueva si no existía.
    var tag = tagsFieldResolveCanonical(raw);
    if(!tag) return;
    links.forEach(function(l){
      l.tags = l.tags.filter(function(x){ return x.toLowerCase() !== tag.toLowerCase(); });
    });
    save();
    render();
  }

  function bulkSetCategory(){
    var links = getSelectedLinks();
    if(links.length === 0) return;
    var raw = prompt("Categoría para los " + linkCountText(links.length) + " seleccionados:");
    if(raw === null) return;
    var name = raw.trim();
    if(!name) return;
    var cat = ensureCategory(name); // crea la categoría si no existía
    links.forEach(function(l){ l.category = cat; });
    save();
    saveCategories();
    render();
  }

  function bulkSetActive(active){
    var links = getSelectedLinks();
    if(links.length === 0) return;
    links.forEach(function(l){ l.active = active; });
    save();
    render();
  }

  // Guarda los enlaces seleccionados como una vista (4.17): una lista explícita
  // de enlaces en vez de un filtro por categorías/etiquetas. A diferencia de
  // "Guardar actual" (promptSaveViewProfile), NO deja la vista aplicada ni
  // vacía la selección — aplicarla cambiaría de golpe lo que se está viendo, en
  // mitad de una posible cadena de acciones en lote sobre ese mismo conjunto.
  function bulkCreateView(){
    var links = getSelectedLinks();
    if(links.length === 0) return;
    var name = prompt("Nombre de la vista con los " + linkCountText(links.length) + " seleccionados:");
    if(name === null) return;
    name = name.trim();
    if(!name) return;
    var linkIds = links.map(function(l){ return l.id; });
    var existingIdx = state.viewProfiles.findIndex(function(p){ return p.name.toLowerCase() === name.toLowerCase(); });
    if(existingIdx !== -1){
      if(!confirm('Ya existe una vista llamada "' + state.viewProfiles[existingIdx].name + '". ¿Sobrescribirla con los enlaces seleccionados?')) return;
      state.viewProfiles[existingIdx].tags = [];
      state.viewProfiles[existingIdx].excludedTags = [];
      state.viewProfiles[existingIdx].selectedCategories = [];
      state.viewProfiles[existingIdx].linkIds = linkIds;
    } else {
      state.viewProfiles.push({ name: name, tags: [], excludedTags: [], selectedCategories: [], linkIds: linkIds });
    }
    saveViewProfiles();
    render();
  }

  function bulkDelete(){
    var links = getSelectedLinks();
    if(links.length === 0) return;
    if(!confirm("¿Eliminar los " + linkCountText(links.length) + " seleccionados? Esta acción no se puede deshacer.")) return;
    state.links = state.links.filter(function(l){ return !state.selectedLinks.has(l.id); });
    // Única acción tras la que la selección no se conserva: ya no existe.
    state.selectedLinks.clear();
    save();
    render();
  }

  // Elige texto negro o blanco según la luminancia del color de fondo, para mantener contraste legible.
  function contrastTextColor(hex){
    var c = String(hex || "").replace("#", "");
    if(c.length === 3) c = c.split("").map(function(ch){ return ch + ch; }).join("");
    if(c.length !== 6) return "#1c2029";
    var r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    var luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
    return luminance > 0.6 ? "#1c2029" : "#ffffff";
  }

  function categoryIconSvg(key, color, className){
    var inner = CATEGORY_ICONS[key];
    if(!inner) return "";
    var style = ' style="color:' + (color || "var(--text-muted)") + ';"';
    return '<svg class="' + (className || "cat-icon") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' + style + '>' + inner + '</svg>';
  }

  // Icono si la categoría tiene uno asignado; si no, el punto de color de siempre.
  function categoryDotHtml(name){
    var iconKey = state.categoryIcons[name];
    var color = state.categoryColors[name];
    if(iconKey) return categoryIconSvg(iconKey, color);
    return '<span class="cat-color-dot" style="background:' + (color || "var(--text-muted)") + ';"></span>';
  }

  function tagChipStyle(tag){
    var color = state.tagColors[tag];
    if(!color) return "";
    return ' style="background:' + color + ';color:' + contrastTextColor(color) + ';"';
  }

  // Barra de color superior de la ficha (vista cómoda), según el color de la
  // categoría del enlace. Sin color personalizado, usa el borde neutro por defecto.
  function categoryTopBarStyle(name){
    var color = state.categoryColors[name];
    return color ? ' style="border-top-color:' + color + ';"' : '';
  }

  // ---------- Render ----------
  function renderSidebar(){
    var categories = getCategories();
    var totalCount = state.links.length;
    var html = '<li class="category-item' + (state.selectedCategories.size === 0 ? ' active' : '') + '" data-category="" title="Quitar el filtro de categoría">' +
                 '<span>Todas</span><span class="count">' + totalCount + '</span></li>';
    categories.forEach(function(c){
      html += '<li class="category-item' + (state.selectedCategories.has(c.name) ? ' active' : '') + '" data-category="' + escapeHtml(c.name) + '" draggable="true" title="Arrastra para reordenar (Ctrl+clic para selección múltiple)">' +
                '<span class="cat-name-wrap">' + categoryDotHtml(c.name) + escapeHtml(c.name) + '</span><span class="count">' + c.count + '</span></li>';
    });
    document.getElementById("categoryList").innerHTML = html;

    var tags = getAllTags();
    var tagCloud = document.getElementById("tagCloud");
    if(tags.length === 0){
      tagCloud.innerHTML = '<span class="tag-empty">Sin etiquetas todavía</span>';
    } else {
      tagCloud.innerHTML = tags.map(function(t){
        var cls = "tag-chip";
        if(state.excludedTags.has(t)) cls += " excluded";
        else if(state.tags.has(t)) cls += " active";
        return '<span class="' + cls + '" data-tag="' + escapeHtml(t) + '" title="Clic para incluir, otro clic para excluir, otro clic para quitar el filtro"' + tagChipStyle(t) + '>' + escapeHtml(t) + '</span>';
      }).join("");
    }

    renderViewProfileList();

    var catOptions = document.getElementById("categoryOptions");
    catOptions.innerHTML = categories.map(function(c){ return '<option value="' + escapeHtml(c.name) + '">'; }).join("");
  }

  // ---------- Vistas guardadas (perfiles de categorías y etiquetas) ----------
  function renderViewProfileList(){
    var list = document.getElementById("viewProfileList");
    if(state.viewProfiles.length === 0){
      list.innerHTML = '<span class="tag-empty">Sin vistas guardadas</span>';
      return;
    }
    list.innerHTML = state.viewProfiles.map(function(p){
      var active = state.activeViewProfile === p.name ? " active" : "";
      return '<span class="view-profile-chip' + active + '" data-profile="' + escapeHtml(p.name) + '" title="Un clic aplica la vista \'' + escapeHtml(p.name) + '\'; otro clic la deselecciona">' +
        escapeHtml(p.name) +
        '<button type="button" class="view-profile-chip-remove" data-action="delete-profile" data-profile="' + escapeHtml(p.name) + '" title="Eliminar vista" aria-label="Eliminar vista">✕</button>' +
      '</span>';
    }).join("");

  function renderCards(){
    var filtered = getFilteredLinks();
    var container = document.getElementById("linksContainer");
    var emptyState = document.getElementById("emptyState");
    document.getElementById("resultCount").textContent = filtered.length + " enlace" + (filtered.length === 1 ? "" : "s");

    if(filtered.length === 0){
      container.innerHTML = "";
      if(state.links.length === 0){
        emptyState.innerHTML = '<strong>Bienvenido a PinBoard.</strong><br>' +
          'Empieza por <button type="button" id="btnEmptyStateAdd" class="link-btn">crear tu primer enlace</button>.<br>' +
          'También puedes importar tus marcadores del navegador con el botón "Importar" del lateral.<br>' +
          'Y en cualquier momento, pulsa <kbd>/</kbd> para buscar.';
      } else {
        emptyState.innerHTML = "No se encontraron enlaces con los filtros actuales.";
      }
      emptyState.hidden = false;
      return;
    }
    emptyState.hidden = true;

    var groups = {};
    filtered.forEach(function(l){
      if(!groups[l.category]) groups[l.category] = [];
      groups[l.category].push(l);
    });
    // Orden manual (state.categories); cualquier categoría de un enlace que
    // por algún motivo no esté en la lista maestra se añade al final (alfabético).
    var orderedNames = state.categories.filter(function(c){ return groups[c]; });
    var extraNames = Object.keys(groups).filter(function(c){ return orderedNames.indexOf(c) === -1; }).sort(function(a,b){ return a.localeCompare(b); });
    var categoryNames = orderedNames.concat(extraNames);
    var compact = state.viewMode === "compact";
    var listClass = compact ? "links-list" : "links-grid";
    var cardFn = compact ? cardHtmlCompact : cardHtml;

    container.innerHTML = categoryNames.map(function(cat){
      var items = groups[cat];
      var cardsHtml = items.map(function(l, i){
        var prevId = i > 0 ? items[i - 1].id : null;
        var nextId = i < items.length - 1 ? items[i + 1].id : null;
        return cardFn(l, prevId, nextId);
      }).join("");
      var collapsed = state.collapsedCategories.has(cat);
      return (
        '<section class="category-group' + (collapsed ? ' collapsed' : '') + '">' +
          '<h2 class="category-group-title" data-category="' + escapeHtml(cat) + '">' +
            '<span class="group-toggle-arrow">▾</span>' +
            categoryDotHtml(cat) +
            escapeHtml(cat) +
            '<span class="category-group-count">' + items.length + '</span>' +
          '</h2>' +
          '<div class="' + listClass + '">' + cardsHtml + '</div>' +
        '</section>'
      );
    }).join("");
  }

  function moveButtonsHtml(l, prevId, nextId){
    return (
      (prevId
        ? '<button class="icon-action-plain" data-action="move-up" data-id="' + l.id + '" data-target="' + prevId + '" title="Subir" aria-label="Subir">▲</button>'
        : '<span class="icon-disabled" aria-hidden="true">▲</span>') +
      (nextId
        ? '<button class="icon-action-plain" data-action="move-down" data-id="' + l.id + '" data-target="' + nextId + '" title="Bajar" aria-label="Bajar">▼</button>'
        : '<span class="icon-disabled" aria-hidden="true">▼</span>')
    );
  }

  // Indicador de notas, compartido por las dos plantillas de ficha: es la única
  // forma de saber que un enlace tiene algo escrito sin abrir el modal (la nota
  // no se pinta en la ficha, puede tener cientos de líneas). Es un botón, y
  // abre el modal directamente con el foco en el campo de notas.
  // Va dentro de .card-icon-actions a propósito: así el modo selección lo oculta
  // con el mismo criterio que ▲▼✏️🗑️ (decisión 21).
  function notesIndicatorHtml(l){
    if(!l.notes) return "";
    return '<button class="icon-action-plain" data-action="notes" data-id="' + escapeHtml(l.id) +
           '" title="Ver o editar las notas de este enlace" aria-label="Notas de ' + escapeHtml(l.title) + '">📝</button>';
  }

  // Casilla de selección, compartida por las dos plantillas de ficha. Solo se
  // genera con el modo selección activo; el estado visual sale siempre de
  // state.selectedLinks (el clic se resuelve en el listener delegado y repinta).
  function selectCheckHtml(l){
    if(!state.selectionMode) return "";
    var checked = state.selectedLinks.has(l.id) ? ' checked' : '';
    return '<input type="checkbox" class="card-select" data-id="' + escapeHtml(l.id) + '"' + checked +
           ' aria-label="Seleccionar ' + escapeHtml(l.title) + '">';
  }

  // Fuera del modo selección las fichas conservan su comportamiento de siempre
  // (arrastrables, con su tooltip de arrastre); dentro, el arrastre se desactiva
  // y el tooltip explica el clic. "base" es el texto informativo de la ficha
  // (título + descripción en la vista compacta), vacío en la cómoda.
  function cardDragAttrs(base){
    var hint = state.selectionMode
      ? "clic para seleccionar o quitar de la selección"
      : "arrastra para reordenar o mover a otra categoría";
    var title = base ? base + " — " + hint : hint.charAt(0).toUpperCase() + hint.slice(1);
    return ' draggable="' + (state.selectionMode ? 'false' : 'true') + '" title="' + escapeHtml(title) + '"';
  }

  function cardHtml(l, prevId, nextId){
    var tagsHtml = l.tags.map(function(t){
      return '<span class="tag" data-tag="' + escapeHtml(t) + '"' + tagChipStyle(t) + '>' + escapeHtml(t) + '</span>';
    }).join("");
    var hostname = hostnameForDisplay(l.url);
    return (
      '<div class="link-card' + (l.active ? '' : ' inactive') + (state.selectedLinks.has(l.id) ? ' selected' : '') + '" data-id="' + l.id + '"' +
        cardDragAttrs("") + categoryTopBarStyle(l.category) + '>' +
        '<div class="card-header">' +
          selectCheckHtml(l) +
          '<div class="card-icon-actions">' +
            notesIndicatorHtml(l) +
            moveButtonsHtml(l, prevId, nextId) +
            '<button class="icon-action-plain" data-action="edit" data-id="' + l.id + '" title="Editar" aria-label="Editar">✏️</button>' +
            '<button class="icon-action-plain icon-danger" data-action="delete" data-id="' + l.id + '" title="Eliminar" aria-label="Eliminar">🗑️</button>' +
          '</div>' +
        '</div>' +
        '<h3>' + faviconImgHtml(l.url) + '<a href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener noreferrer" draggable="false">' + escapeHtml(l.title) + '</a></h3>' +
        (hostname ? '<div class="url">' + escapeHtml(hostname) + '</div>' : '') +
        (l.description ? '<p class="description">' + escapeHtml(l.description) + '</p>' : '') +
        (tagsHtml ? '<div class="tags">' + tagsHtml + '</div>' : '') +
      '</div>'
    );
  }

  function cardHtmlCompact(l, prevId, nextId){
    var tagsHtml = l.tags.map(function(t){
      return '<span class="tag" data-tag="' + escapeHtml(t) + '"' + tagChipStyle(t) + '>' + escapeHtml(t) + '</span>';
    }).join("");
    var tooltip = l.title + (l.description ? " — " + l.description : "");
    return (
      '<div class="link-card-compact' + (l.active ? '' : ' inactive') + (state.selectedLinks.has(l.id) ? ' selected' : '') + '" data-id="' + l.id + '"' +
        cardDragAttrs(tooltip) + '>' +
        selectCheckHtml(l) +
        faviconImgHtml(l.url) +
        '<a class="compact-title" href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener noreferrer" draggable="false">' + escapeHtml(l.title) + '</a>' +
        (tagsHtml ? '<div class="tags compact-tags">' + tagsHtml + '</div>' : '') +
        '<div class="card-icon-actions">' +
          notesIndicatorHtml(l) +
          moveButtonsHtml(l, prevId, nextId) +
          '<button class="icon-action-plain" data-action="edit" data-id="' + l.id + '" title="Editar" aria-label="Editar">✏️</button>' +
          '<button class="icon-action-plain icon-danger" data-action="delete" data-id="' + l.id + '" title="Eliminar" aria-label="Eliminar">🗑️</button>' +
        '</div>' +
      '</div>'
    );
  }

  function toggleCategoryCollapse(cat){
    if(state.collapsedCategories.has(cat)) state.collapsedCategories.delete(cat);

  // ---------- Registro de overlays ----------
  // Único origen de verdad de "qué overlays existen y cómo se cierran".
  // Antes esa lista estaba escrita a mano en dos sitios (el manejador de Escape
  // y la comprobación de atajos bloqueados) y se quedó desactualizada al añadir
  // el modal de importar categorías: Escape no lo cerraba y "n" abría el modal
  // de nuevo enlace encima. Registrando cada overlay una sola vez, cualquier
  // overlay futuro queda cubierto por los dos comportamientos automáticamente.
  var OVERLAYS = [];

  // Registra un overlay y, de paso, lo cierra al hacer click fuera del modal,
  // sin confundir con una selección de texto que empieza dentro del modal y se
  // suelta fuera (el mouseup fuera dispara un click sintético sobre el overlay).
  function registerOverlay(overlayEl, closeFn){
    OVERLAYS.push({ el: overlayEl, close: closeFn });
    var mousedownOnOverlay = false;
    overlayEl.addEventListener("mousedown", function(e){
      mousedownOnOverlay = (e.target === overlayEl);
    });
    overlayEl.addEventListener("click", function(e){
      if(e.target === overlayEl && mousedownOnOverlay) closeFn();
      mousedownOnOverlay = false;
    });
  }

  // ¿Hay algún overlay abierto? Los atajos de una tecla se ignoran mientras lo haya.
  function anyOverlayOpen(){
    return OVERLAYS.some(function(o){ return !o.el.hidden; });
  }

  function closeOpenOverlays(){
    OVERLAYS.forEach(function(o){
      if(!o.el.hidden) o.close();
    });
  }

  // ---------- Modal / formulario ----------
  var overlay = document.getElementById("modalOverlay");
  var form = document.getElementById("linkForm");

  var tagsChipsWrap = document.getElementById("tagsChipsWrap");
  var tagsInput = document.getElementById("tagsInput");
  var tagsSuggestionsEl = document.getElementById("tagsSuggestions");
  var fieldTagsHidden = document.getElementById("fieldTags");

  var tagsFieldChips = [];           // etiquetas confirmadas como chip, ej. ["#trabajo","#referencia"]
  var tagsFieldSuggestionItems = [];  // sugerencias actualmente pintadas en el desplegable
  var tagsFieldHighlightIndex = -1;   // índice resaltado del desplegable, -1 = ninguno

  // ---------- Editor de chips de etiquetas ----------

  function tagsFieldSetChips(tags){
    tagsFieldChips = (tags || []).slice();
    tagsInput.value = "";
    closeTagsSuggestions();
    renderTagsChips();
    syncTagsHiddenInput();
  }

  function renderTagsChips(){
    Array.prototype.slice.call(tagsChipsWrap.children).forEach(function(child){
      if(child !== tagsInput) tagsChipsWrap.removeChild(child);
    });
    tagsFieldChips.forEach(function(tag){
      var chip = document.createElement("span");
      chip.className = "tag-chip tags-chip";
      chip.textContent = tag;
      var removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "tags-chip-remove";
      removeBtn.setAttribute("aria-label", "Eliminar etiqueta " + tag);
      removeBtn.setAttribute("data-tag", tag);
      removeBtn.textContent = "×";
      chip.appendChild(removeBtn);
      tagsChipsWrap.insertBefore(chip, tagsInput);
    });
  }

  function syncTagsHiddenInput(){
    fieldTagsHidden.value = tagsFieldChips.join(" ");
  }

  // Resuelve el texto tecleado al nombre canónico existente (case-insensitive),
  // SIN llamar a ensureTag: no queremos ensuciar state.allTags con chips que el
  // usuario cancele antes de guardar (ensureTag real solo se dispara en el submit).
  function tagsFieldResolveCanonical(raw){
    var clean = "#" + String(raw == null ? "" : raw).trim().replace(/^#+/, "");
    if(clean.length <= 1) return null;
    var existing = state.allTags.find(function(t){ return t.toLowerCase() === clean.toLowerCase(); });
    return existing || clean;
  }

  function tagsFieldCommitToken(raw){
    // Cierra el desplegable ANTES de tocar el DOM de los chips: si se cierra
    // después, el desplegable (position:absolute) puede reposicionarse por el
    // crecimiento del wrap de chips justo antes de desaparecer, dejando una
    // ventana en la que un evento tardío del propio desplegable puede acabar
    // resolviéndose contra un elemento que ha quedado en su lugar.
    closeTagsSuggestions();
    var canonical = tagsFieldResolveCanonical(raw);
    if(canonical){
      var exists = tagsFieldChips.some(function(t){ return t.toLowerCase() === canonical.toLowerCase(); });
      if(!exists){
        tagsFieldChips.push(canonical);
        renderTagsChips();
        syncTagsHiddenInput();
      }
    }
    tagsInput.value = "";
  }

  function tagsFieldCommitFromText(raw){

  function getTagsFieldSuggestions(){
    var raw = tagsInput.value.trim().replace(/^#+/, "").toLowerCase();

    var chosen = tagsFieldChips.map(function(t){ return t.toLowerCase(); });
    return getAllTags().filter(function(t){
      var name = t.replace(/^#+/, "").toLowerCase();
      return name.indexOf(raw) !== -1 && chosen.indexOf(t.toLowerCase()) === -1;
    }).slice(0, 8);
  }

    tagsSuggestionsEl.innerHTML = "";

  // "focusNotes" solo lo usa el indicador 📝 de las fichas (4.23): abre el modal

  }

  // Crea una copia del enlace que se está editando (título + " _copia") y

  function duplicateEditingLink(){
    var original = state.links.find(function(l){ return l.id === editingId; });
    if(!original) return;
    var copy = {
      id: genId(),
      category: original.category,
      title: original.title + " _copia",
      url: original.url,
      description: original.description,
      active: original.active,
      tags: original.tags.slice()
    };
    if(original.notes) copy.notes = original.notes;
    state.links.push(copy);
    save();
    render();
    openModal(copy);
  }

    var category = document.getElementById("fieldCategory").value.trim();

      if(!proceed) return;
    }

    category = ensureCategory(category);
    tags = tags.map(ensureTag);

    if(editingId){
      var link = state.links.find(function(l){ return l.id === editingId; });

    } else {

  // ---------- Puente para la extensión de navegador ----------
  // Superficie mínima y estable pensada para ser llamada desde fuera de esta
  // IIFE (p. ej. una extensión inyectando código en el "MAIN world" de esta
  // página). Reutiliza la lógica de duplicados/guardado ya existente en vez
  // de duplicarla, para que el origen de verdad siga siendo este archivo.
  //
  // CONTRATO ESTABLE — no cambiar sin revisar extension/background.js:
  // (contrato completo en docs/ESPECIFICACIONES.md, sección 8)
  //   - Firma de los 5 métodos de abajo (checkDuplicate/focusExisting/
  //     suggestCategory/prefillAndOpen/appendNote).
  //   - Clases ".link-card"/".link-card-compact" + atributo "data-id" en el
  //     elemento raíz de cada ficha (las usa highlightLink() más abajo).
  //   - Ids de campo fieldCategory/fieldTitle/fieldUrl/fieldDescription
  //     (los rellena prefillAndOpen vía getElementById(...).value) y fieldNotes
  //     (lo rellena appendNote cuando el enlace todavía no existe).
  // Si se rompe algo de esto, la extensión falla en silencio (solo un badge
  // rojo "!" en su icono), sin ningún error visible aquí.
  function suggestCategory(title, description, url){
    var haystack = ((title || "") + " " + (description || "") + " " + (url || "")).toLowerCase();
    var host = "";
    try{ host = new URL(url).hostname.toLowerCase(); }catch(e){}
    var best = null, bestScore = 0;
    state.categories.forEach(function(cat){
      var words = cat.toLowerCase().split(/\s+/).filter(Boolean);
      var score = 0;
      words.forEach(function(w){ if(w.length > 2 && haystack.indexOf(w) !== -1) score++; });
      if(host && cat.length > 2 && host.indexOf(cat.toLowerCase()) !== -1) score += 2;
      if(score > bestScore){ bestScore = score; best = cat; }
    });
    return best || "";
  }

  function highlightLink(id){
    var el = document.querySelector('.link-card[data-id="' + id + '"], .link-card-compact[data-id="' + id + '"]');
    if(!el) return;
    el.scrollIntoView({behavior:"smooth", block:"center"});
    el.classList.add("bridge-highlight");
    setTimeout(function(){ el.classList.remove("bridge-highlight"); }, 2000);
  }

  // Abre el modal de "Nuevo enlace" con los campos precargados; el usuario
  // sigue confirmando y pulsando "Guardar" como en el flujo manual.
  // Función con nombre (y no un método anónimo del objeto de abajo) porque
  // appendNote la reutiliza para el caso "la URL todavía no existe".
  function prefillAndOpen(data){
    data = data || {};
    openModal(null);
    document.getElementById("fieldCategory").value = data.category || "";
    document.getElementById("fieldTitle").value = data.title || "";
    document.getElementById("fieldUrl").value = data.url || "";
    document.getElementById("fieldDescription").value = data.description || "";
    window.focus();
    document.getElementById("fieldTitle").focus();
  }

  window.PinBoardBridge = {
    // Comprueba si la URL ya existe. Devuelve {id, title, category} o null.
    checkDuplicate: function(url){
      var d = findDuplicateUrl(url, null);
      return d ? { id: d.id, title: d.title, category: d.category } : null;
    },
    // Desplaza la vista hasta el enlace existente y lo resalta brevemente.
    focusExisting: function(url){
      var d = findDuplicateUrl(url, null);
      if(d) highlightLink(d.id);
    },
    // Heurística simple: propone una categoría ya existente según coincidencias
    // de palabras en título/descripción/dominio. No inventa categorías nuevas.
    suggestCategory: suggestCategory,
    prefillAndOpen: prefillAndOpen,
    // Añade una nota al enlace de esa URL. El texto llega ya formateado como el
    // usuario lo quiere ver (una selección capturada llega como cita "> ..."):
    // aquí solo se le pone el encabezado de fecha y se acumula al final.
    //
    // Asimetría deliberada (decisión 33): si la URL ya existe, la nota se añade
    // sin modal ni confirmación —es aditivo sobre un enlace que el usuario ya
    // curó—; si no existe, se abre el modal precargado y la crea él, porque la
    // categoría es una heurística que puede fallar. Devuelve
    // {ok, created, id?, title?, category?, noteCount?} para que la extensión
    // sepa si tiene que saltar a esta pestaña (creación) o basta con avisar en
    // la página donde está el usuario (añadido), y con qué recuento.
    appendNote: function(data){
      data = data || {};
      var url = String(data.url == null ? "" : data.url).trim();
      var note = String(data.note == null ? "" : data.note).trim();
      if(!url || !note) return { ok: false, reason: "empty-note" };
      var block = formatNoteBlock(note);
      var existing = findDuplicateUrl(url, null);
      if(existing){
        existing.notes = appendNoteToText(existing.notes, block);
        save();
        render();
        highlightLink(existing.id);
        return { ok: true, created: false, id: existing.id, title: existing.title, category: existing.category, noteCount: countNoteBlocks(existing.notes) };
      }
      var category = suggestCategory(data.title, data.description, url);
      prefillAndOpen({ category: category, title: data.title, url: url, description: data.description });
      document.getElementById("fieldNotes").value = block;
      return { ok: true, created: true, category: category };
    }
  };

  // Aplica el renombrado (categoría o etiqueta) a las listas maestras y a los enlaces afectados.
  // Si el nuevo nombre coincide (sin distinguir mayúsculas) con uno ya existente, los fusiona.
  function performRename(oldName, rawNewValue){
    if(manageType === "category"){
      var newName = rawNewValue.trim();
      if(!newName || newName === oldName) return;
      // ¿El nuevo nombre ya existe como otra categoría? -> fusión (oldName desaparece).
      // Si no, es un renombrado simple: se mantiene la posición de oldName en el orden manual.
      var existingIdx = state.categories.findIndex(function(c){ return c.toLowerCase() === newName.toLowerCase() && c !== oldName; });
      var canonicalCat;
      if(existingIdx !== -1){
        canonicalCat = state.categories[existingIdx];
        state.links.forEach(function(l){ if(l.category === oldName) l.category = canonicalCat; });
        state.categories = state.categories.filter(function(c){ return c !== oldName; });
      } else {
        canonicalCat = newName;
        var idx = state.categories.indexOf(oldName);
        if(idx !== -1) state.categories[idx] = newName;
        state.links.forEach(function(l){ if(l.category === oldName) l.category = newName; });
      }
      if(state.selectedCategories.has(oldName)){
        state.selectedCategories.delete(oldName);
        state.selectedCategories.add(canonicalCat);
      }
      if(state.categoryColors[oldName] && !state.categoryColors[canonicalCat]){
        state.categoryColors[canonicalCat] = state.categoryColors[oldName];
      }
      delete state.categoryColors[oldName];
      saveCategoryColors();
      if(state.categoryIcons[oldName] && !state.categoryIcons[canonicalCat]){
        state.categoryIcons[canonicalCat] = state.categoryIcons[oldName];
      }
      delete state.categoryIcons[oldName];
      saveCategoryIcons();
      save();
      saveCategories();
    } else {
      var raw = rawNewValue.trim();
      if(!raw) return;
      var newTag = "#" + raw.replace(/^#+/, "");
      if(newTag === oldName) return;
      state.links.forEach(function(l){
        var idx = l.tags.indexOf(oldName);
        if(idx !== -1){
          l.tags.splice(idx, 1);
          if(l.tags.indexOf(newTag) === -1) l.tags.push(newTag);
        }
      });
      state.allTags = state.allTags.filter(function(t){ return t !== oldName; });
      var canonicalTag2 = ensureTag(newTag);
      if(canonicalTag2 !== newTag){
        state.links.forEach(function(l){
          var idx2 = l.tags.indexOf(newTag);
          if(idx2 !== -1) l.tags[idx2] = canonicalTag2;
        });
      }
      if(state.tags.has(oldName)){ state.tags.delete(oldName); state.tags.add(canonicalTag2); }
      if(state.excludedTags.has(oldName)){
        state.excludedTags.delete(oldName);
        state.excludedTags.add(canonicalTag2);
        saveExcludedTags();
      }

  function promptSaveViewProfile(){
    var name = prompt("Nombre de la vista:");
    if(name === null) return;
    name = name.trim();
    if(!name) return;
    var tags = Array.from(state.tags);
    var excluded = Array.from(state.excludedTags);
    var categories = Array.from(state.selectedCategories);
    var linkIds = Array.from(state.viewLinkIds);
    var existingIdx = state.viewProfiles.findIndex(function(p){ return p.name.toLowerCase() === name.toLowerCase(); });
    if(existingIdx !== -1){
      if(!confirm('Ya existe una vista llamada "' + state.viewProfiles[existingIdx].name + '". ¿Sobrescribirla con la selección actual?')) return;
      state.viewProfiles[existingIdx].tags = tags;
      state.viewProfiles[existingIdx].excludedTags = excluded;
      state.viewProfiles[existingIdx].selectedCategories = categories;
      state.viewProfiles[existingIdx].linkIds = linkIds;
    } else {
      state.viewProfiles.push({ name: name, tags: tags, excludedTags: excluded, selectedCategories: categories, linkIds: linkIds });
    }
    // La vista recién guardada representa exactamente la selección actual:
    // queda como la vista aplicada.
    state.activeViewProfile = name;

  function exportLinks(){
    var links = getLinksForExport();
    if(hasLinkSelection()){
      var n = links.length;
      var msg = n === 1
        ? "Tienes un filtro activo (categoría, etiquetas o una vista de enlaces): solo se exportará el enlace visible con la selección actual, no todos tus enlaces. ¿Continuar?"
        : "Tienes un filtro activo (categoría, etiquetas o una vista de enlaces): solo se exportarán los " + n + " enlaces visibles con la selección actual, no todos tus enlaces. ¿Continuar?";
      if(!confirm(msg)) return;
    }
    var blob = new Blob([JSON.stringify(links, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    var d = new Date();
    var stamp = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    a.download = "pinboard_" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
