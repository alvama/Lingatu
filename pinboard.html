  function performImportReplace(data){
    state.links = data.map(function(l){
      var link = {
        id: l.id || genId(),
        category: String(l.category),
        title: String(l.title),
        url: String(l.url),
        description: l.description ? String(l.description) : "",
        active: l.active !== false,
        tags: Array.isArray(l.tags) ? normalizeTags(l.tags.join(" ")) : []
      };
      if(l.notes) link.notes = String(l.notes);
      return link;
    });
    state.links.forEach(function(l){
      l.category = ensureCategory(l.category);
      l.tags = l.tags.map(ensureTag);
    });
    save();
    saveCategories();
    saveAllTags();
    resetFiltersAfterImport();
    render();
  }

  function performImportMerge(data){
    var existingUrls = {};
    state.links.forEach(function(l){ existingUrls[normalizeUrlForCompare(l.url)] = true; });
    var added = 0, skipped = 0;
    data.forEach(function(raw){
      var url = String(raw.url || "").trim();
      var key = normalizeUrlForCompare(url);
      if(!url || existingUrls[key]){ skipped++; return; }
      existingUrls[key] = true;
      var tags = Array.isArray(raw.tags) ? normalizeTags(raw.tags.join(" ")).map(ensureTag) : [];
      var link = {
        id: genId(),
        category: ensureCategory(String(raw.category || "Sin categoría")),
        title: String(raw.title || url),
        url: url,
        description: raw.description ? String(raw.description) : "",
        active: raw.active !== false,
        tags: tags
      };
      if(raw.notes) link.notes = String(raw.notes);
      state.links.push(link);
      added++;
    });
    save();
    saveCategories();
    saveAllTags();
    resetFiltersAfterImport();
    render();
    alert("Importación completada: " + added + " enlaces añadidos, " + skipped + " omitidos (URL ya existente o vacía).");
  }

  // ---------- Parseo de formatos de marcadores externos (Chromium / Netscape) ----------
  // Referencia de comportamiento para el formato Chromium: tools/convertir_marcadores.py:16-41.
  // Deduplica dentro del propio archivo (un mismo marcador puede estar en dos carpetas):
  // performImportReplace no dedupica por sí solo, así que sin esto "Sustituir todo"
  // crearía duplicados (ver CLAUDE.md, apartado "Lo que se rompe en silencio").
  function parseChromiumBookmarks(root){
    var out = [];
    var seen = {};
    function walk(node, path){
      if(!node || typeof node !== "object") return;
      if(node.type === "url"){
        var url = String(node.url || "").trim();
        if(!/^https?:\/\//i.test(url)) return;
        if(seen[url]) return;
        seen[url] = true;
        var title = String(node.name || "").trim() || url;
        var category = path.filter(function(p){ return p; }).join(" / ") || "Sin categoría";
        out.push({ category: category, title: title, url: url, description: "", active: true, tags: [] });
        return;
      }
      if(node.type !== "folder") return;
      var name = String(node.name || "").trim();
      var newPath = name ? path.concat([name]) : path;
      (node.children || []).forEach(function(child){ walk(child, newPath); });
    }
    Object.keys(root.roots || {}).forEach(function(key){
      var rootNode = root.roots[key];
      if(rootNode && typeof rootNode === "object" && rootNode.type === "folder") walk(rootNode, []);
    });
    return out;
  }

  // El HTML Netscape es deliberadamente mal formado (<DT>/<p> sin cerrar): se parsea con
  // DOMParser (nunca metiendo el archivo en un innerHTML) y se reconstruye la ruta de
  // carpetas subiendo desde cada <A> por sus ancestros <DL>. Comprobado empíricamente que
  // el navegador anida cada <DL> DENTRO del <DT> que lo precede (no como hermano): la
  // carpeta de un <DL> es el <H3> que sea hijo directo de ese mismo <DT> contenedor.
  function netscapeFolderPath(anchor){
    var path = [];
    var dl = anchor.closest("dl");
    while(dl){
      var ownerDt = (dl.parentElement && dl.parentElement.tagName === "DT") ? dl.parentElement : null;
      if(!ownerDt) break;
      var heading = null;
      for(var i = 0; i < ownerDt.children.length; i++){
        if(ownerDt.children[i].tagName === "H3"){ heading = ownerDt.children[i].textContent.trim(); break; }
      }
      if(heading) path.unshift(heading);
      dl = ownerDt.parentElement;
    }
    return path;
  }

  function parseNetscapeBookmarks(text){
    var doc = new DOMParser().parseFromString(text, "text/html");
    var anchors = doc.querySelectorAll("a[href]");
    var out = [];
    var seen = {};
    anchors.forEach(function(a){
      var url = (a.getAttribute("href") || "").trim();
      if(!/^https?:\/\//i.test(url)) return; // omite bookmarklets (javascript:), chrome://, about:, place:...
      if(seen[url]) return;
      seen[url] = true;
      var title = (a.textContent || "").trim() || url;
      var category = netscapeFolderPath(a).join(" / ") || "Sin categoría";
      out.push({ category: category, title: title, url: url, description: "", active: true, tags: [] });
    });
    return out;
  }

  var IMPORT_FORMAT_LABELS = {
    pinboard: "JSON de PinBoard",
    chromium: "marcadores de Chrome/Edge (Bookmarks)",
    netscape: "HTML de marcadores exportado por un navegador"
  };

  // Enruta por contenido, no por extensión: el "Bookmarks" de Chromium no tiene ninguna.
  function parseImportFile(text){
    var trimmed = text.trim();
    if(trimmed.charAt(0) === "["){
      var data = JSON.parse(trimmed);
      if(!Array.isArray(data)) throw new Error("Formato inválido");
      var valid = data.every(function(l){ return l && l.category && l.title && l.url; });
      if(!valid) throw new Error("Formato inválido");
      return { data: data, format: "pinboard" };
    }
    if(trimmed.charAt(0) === "{"){
      var obj = null;
      try{ obj = JSON.parse(trimmed); }catch(err){ obj = null; }
      if(!obj || typeof obj !== "object" || !obj.roots){
        throw new Error("Formato de archivo no reconocido.");
      }
      return { data: parseChromiumBookmarks(obj), format: "chromium" };
    }
    if(trimmed.indexOf("NETSCAPE-Bookmark") !== -1 || /<DL/i.test(trimmed)){
      return { data: parseNetscapeBookmarks(text), format: "netscape" };
    }
    throw new Error("Formato de archivo no reconocido. Debe ser un JSON de PinBoard, un archivo Bookmarks de Chrome/Edge o un HTML de marcadores exportado por un navegador.");
  }

  var fileImport = document.getElementById("fileImport");
  var pendingImportData = null;
  var importModalOverlay = document.getElementById("importModalOverlay");

  function closeImportModal(){
    importModalOverlay.hidden = true;
    pendingImportData = null;
  }

  // Parte compartida entre el selector de archivo (#fileImport) y soltar un archivo sobre
  // la página: valida, rellena el resumen y abre el modal de importación.
  function handleImportFileText(text){
    var result;
    try{
      result = parseImportFile(text);
    }catch(err){
      alert("No se pudo importar el archivo: " + err.message);
      return;
    }
    pendingImportData = result.data;
    document.getElementById("importSummary").textContent =
      "Formato reconocido: " + IMPORT_FORMAT_LABELS[result.format] + ". El archivo contiene " + result.data.length +
      " enlaces. Tienes " + state.links.length + " enlaces actualmente. " +
      '"Fusionar" añade solo los que no tengas ya (comparando por URL). "Sustituir todo" borra tus enlaces actuales y los reemplaza por los del archivo.';
    importModalOverlay.hidden = false;
  }

  document.getElementById("btnImport").addEventListener("click", function(){ fileImport.click(); });
  fileImport.addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      handleImportFileText(String(reader.result));
      fileImport.value = "";
    };
    reader.readAsText(file);
  });

  document.getElementById("importMergeBtn").addEventListener("click", function(){
    if(pendingImportData) performImportMerge(pendingImportData);
    closeImportModal();
  });
  document.getElementById("importReplaceBtn").addEventListener("click", function(){
    var data = pendingImportData;
    if(!data){ closeImportModal(); return; }
    if(confirm("Vas a sustituir tus " + state.links.length + " enlaces actuales por los " + data.length + " del archivo. Esta acción no se puede deshacer. ¿Continuar?")){
      performImportReplace(data);
      closeImportModal();
    }
  });
  document.getElementById("importCancelBtn").addEventListener("click", closeImportModal);
  registerOverlay(importModalOverlay, closeImportModal);

  // ---------- Arrastrar y soltar un archivo de marcadores sobre la página (R1) ----------
  // Sin esto, soltar un archivo en cualquier punto de la página navega a él y la app
  // desaparece: ninguno de los manejadores de #linksContainer/#categoryList llega a
  // preventDefault() en un arrastre externo, porque ambos empiezan comprobando su propio
  // arrastre interno (draggedLinkId/draggedCategoryName) y salen antes si no lo hay.
  var fileDropIndicator = document.getElementById("fileDropIndicator");

  function isInternalDrag(){
    return !!(draggedLinkId || draggedCategoryName);
  }

  document.addEventListener("dragenter", function(e){
    if(isInternalDrag()) return;
    e.preventDefault();
    fileDropIndicator.classList.add("visible");
  });

  document.addEventListener("dragover", function(e){
    if(isInternalDrag()) return;
    e.preventDefault();
  });

  document.addEventListener("dragleave", function(e){
    if(isInternalDrag()) return;
    // dragleave también se dispara al pasar sobre hijos; solo ocultar al salir de la ventana.
    if(e.clientX <= 0 || e.clientY <= 0 || e.clientX >= window.innerWidth || e.clientY >= window.innerHeight){
      fileDropIndicator.classList.remove("visible");
    }
  });

  document.addEventListener("drop", function(e){
    fileDropIndicator.classList.remove("visible");
    if(isInternalDrag()) return; // deja actuar a los manejadores de #linksContainer/#categoryList
    e.preventDefault(); // nunca dejar que el navegador navegue al archivo soltado
    var files = e.dataTransfer && e.dataTransfer.files;
    if(!files || files.length === 0) return; // hueco para "arrastrar una URL" (text/uri-list), tarea aparte
    var reader = new FileReader();
    reader.onload = function(){ handleImportFileText(String(reader.result)); };
    reader.onerror = function(){ alert("No se pudo leer el archivo soltado."); };
    reader.readAsText(files[0]);
  });

  // ---------- Exportar / Importar categorías ----------
  document.getElementById("btnExportCategories").addEventListener("click", function(){
    var data = state.categories.map(function(name){
      return {
        name: name,
        icon: state.categoryIcons[name] || null,
        color: state.categoryColors[name] || null
      };
    });
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    var d = new Date();
    var stamp = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    a.download = "pinboard_categorias_" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  });

  function performImportCategoriesMerge(data){
    var added = 0, skipped = 0;
    data.forEach(function(entry){
      var name = String(entry.name || "").trim();
      if(!name) return;
      var existed = state.categories.some(function(c){ return c.toLowerCase() === name.toLowerCase(); });
      var canonical = ensureCategory(name);
      if(existed){ skipped++; return; }
      added++;
      if(entry.icon && CATEGORY_ICONS.hasOwnProperty(entry.icon)) state.categoryIcons[canonical] = entry.icon;
      if(entry.color) state.categoryColors[canonical] = String(entry.color);
    });
    saveCategories();
    saveCategoryColors();
    saveCategoryIcons();
    renderManageList();
    render();
    alert("Importación completada: " + added + " categorías añadidas, " + skipped + " omitidas (ya existían).");
  }

  function performImportCategoriesReplace(data){
    var names = [], colors = {}, icons = {};
    data.forEach(function(entry){
      var name = String(entry.name || "").trim();
      if(!name || names.indexOf(name) !== -1) return;
      names.push(name);
      if(entry.icon && CATEGORY_ICONS.hasOwnProperty(entry.icon)) icons[name] = entry.icon;
      if(entry.color) colors[name] = String(entry.color);
    });
    state.categories = names;
    state.categoryColors = colors;
    state.categoryIcons = icons;
    var fallback = null;
    state.links.forEach(function(l){
      if(names.indexOf(l.category) === -1){
        if(!fallback) fallback = ensureCategory("Sin categoría");
        l.category = fallback;
      }
    });
    state.selectedCategories = new Set(Array.from(state.selectedCategories).filter(function(c){
      return state.categories.indexOf(c) !== -1;
    }));
    save();
    saveCategories();
    saveCategoryColors();
    saveCategoryIcons();
    renderManageList();
    render();
  }

  var fileImportCategories = document.getElementById("fileImportCategories");
  var pendingImportCategoriesData = null;
  var importCategoriesModalOverlay = document.getElementById("importCategoriesModalOverlay");

  function closeImportCategoriesModal(){
    importCategoriesModalOverlay.hidden = true;
    pendingImportCategoriesData = null;
  }

  document.getElementById("btnImportCategories").addEventListener("click", function(){ fileImportCategories.click(); });
  fileImportCategories.addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(!Array.isArray(data)) throw new Error("Formato inválido");
        var valid = data.every(function(c){ return c && c.name; });
        if(!valid) throw new Error("Formato inválido");
        pendingImportCategoriesData = data;
        document.getElementById("importCategoriesSummary").textContent =
          "El archivo contiene " + data.length + " categorías. Tienes " + state.categories.length + " categorías actualmente. " +
          '"Fusionar" añade solo las que no tengas ya (por nombre), sin tocar las existentes. "Sustituir todo" reemplaza tus categorías, iconos, colores y orden por los del archivo (los enlaces de categorías eliminadas pasan a "Sin categoría").';
        importCategoriesModalOverlay.hidden = false;
      }catch(err){
        alert("No se pudo importar el archivo: " + err.message);
      }
      fileImportCategories.value = "";
    };
    reader.readAsText(file);
  });

  document.getElementById("importCategoriesMergeBtn").addEventListener("click", function(){
    if(pendingImportCategoriesData) performImportCategoriesMerge(pendingImportCategoriesData);
    closeImportCategoriesModal();
  });
  document.getElementById("importCategoriesReplaceBtn").addEventListener("click", function(){
    var data = pendingImportCategoriesData;
    if(!data){ closeImportCategoriesModal(); return; }
    if(confirm("Vas a sustituir tus " + state.categories.length + " categorías actuales por las " + data.length + " del archivo. Esta acción no se puede deshacer. ¿Continuar?")){
      performImportCategoriesReplace(data);
      closeImportCategoriesModal();
    }
  });
  document.getElementById("importCategoriesCancelBtn").addEventListener("click", closeImportCategoriesModal);
  registerOverlay(importCategoriesModalOverlay, closeImportCategoriesModal);

  // ---------- Paleta de comandos (Ctrl+K) ----------
  // COMMANDS es el único origen de verdad de las acciones globales de la app:
  // cada entrada llama a la misma función con nombre que llama el botón
  // correspondiente, nunca a una copia de su lógica. Así la paleta no puede
  // desincronizarse con la interfaz: cambiar lo que hace un botón cambia a la
  // vez lo que hace su comando.
  //   label     cadena, o función que la devuelve (para etiquetas cambiantes).
  //   hint      atajo de teclado ya existente para esa acción, si lo tiene.
  //   available función opcional: si devuelve false, el comando no se ofrece.
  var COMMANDS = [
    { id: "add-link", label: "Nuevo enlace", hint: "n", run: function(){ openModal(null); } },
    { id: "focus-search", label: "Buscar enlaces", hint: "/", run: function(){ document.getElementById("searchInput").focus(); } },
    { id: "edit-site-title", label: "Cambiar el título de la página", run: function(){ promptSiteTitle(); } },
    { id: "manage-categories", label: "Gestionar categorías", run: function(){ openManageModal("category"); } },
    { id: "manage-tags", label: "Gestionar etiquetas", run: function(){ openManageModal("tag"); } },
    // La etiqueta se lee del propio botón, que render() ya mantiene sincronizado
    // con syncToggleAllGroupsLabel(): mismo texto que ve el usuario, sin duplicar
    // el cálculo de "están todas plegadas".
    { id: "toggle-all-groups", label: function(){ return document.getElementById("btnToggleAllGroups").textContent; }, run: function(){ toggleAllGroups(); } },
    { id: "clear-tag-selection", label: "Limpiar selección de etiquetas",
      available: function(){ return state.tags.size > 0 || state.excludedTags.size > 0; },
      run: function(){ clearTagSelection(); } },
    { id: "save-view-profile", label: "Guardar la vista actual", run: function(){ promptSaveViewProfile(); } },
    { id: "status-all", label: "Ver todos los enlaces", run: function(){ setStatusFilter("all"); } },
    { id: "status-active", label: "Ver solo los enlaces activos", run: function(){ setStatusFilter("active"); } },
    { id: "view-comfortable", label: "Vista cómoda", run: function(){ setViewMode("comfortable"); } },
    { id: "view-compact", label: "Vista compacta", run: function(){ setViewMode("compact"); } },
    { id: "export-links", label: "Exportar enlaces", run: function(){ exportLinks(); } },
    { id: "import-links", label: "Importar enlaces", run: function(){ fileImport.click(); } }
  ];

  var paletteOverlay = document.getElementById("commandPaletteOverlay");
  var paletteInput = document.getElementById("commandPaletteInput");
  var paletteResultsEl = document.getElementById("commandPaletteResults");
  var paletteEmptyEl = document.getElementById("commandPaletteEmpty");

  var paletteGroups = [];         // grupos con resultados, en el orden en que se pintan
  var paletteItems = [];          // esos mismos resultados aplanados
  var paletteHighlightIndex = -1; // índice resaltado, -1 = ninguno

  function commandLabel(cmd){
    return typeof cmd.label === "function" ? cmd.label() : cmd.label;
  }

  // Sin mayúsculas y sin acentos: "categoria" tiene que encontrar "Categorías"
  // y "diseno" la categoría "Diseño". Se aplica igual a la consulta y al texto.
  var COMBINING_MARKS = new RegExp("[\\u0300-\\u036f]", "g");

  function paletteNormalize(str){
    return String(str == null ? "" : str).normalize("NFD").replace(COMBINING_MARKS, "").toLowerCase();
  }

  function paletteMatches(text, normalizedQuery){
    return paletteNormalize(text).indexOf(normalizedQuery) !== -1;
  }

  // Los enlaces se buscan sobre state.links completo, ignorando los filtros
  // activos: el propósito de la paleta es alcanzar algo que ahora mismo no se
  // está viendo, así que getFilteredLinks() sería justo lo contrario.
  function paletteLinkResults(q){
    return state.links.filter(function(l){
      return paletteMatches(l.title, q) ||
        paletteMatches(l.description, q) ||
        paletteMatches(l.url, q) ||
        paletteMatches((l.tags || []).join(" "), q);
    }).slice(0, 8).map(function(l){
      return {
        label: l.title,
        meta: hostnameForDisplay(l.url) || l.url,
        run: function(){ window.open(l.url, "_blank", "noopener"); }
      };
    });
  }

  function paletteCommandResults(q){
    return COMMANDS.filter(function(c){
      if(c.available && !c.available()) return false;
      return !q || paletteMatches(commandLabel(c), q);
    }).map(function(c){
      return { label: commandLabel(c), hint: c.hint, run: c.run };
    });
  }

  // Grupos en el orden en que se pintan; la cabecera solo aparece si el grupo
  // tiene resultados. Con la consulta vacía se muestran solo los comandos, que
  // es cuando la paleta hace de documentación de lo que sabe hacer la app.
  function buildPaletteGroups(rawQuery){
    var q = paletteNormalize(rawQuery.trim());
    var groups = [{ title: "Comandos", items: paletteCommandResults(q) }];
    if(!q) return groups.filter(function(g){ return g.items.length > 0; });

    groups.push({ title: "Enlaces", items: paletteLinkResults(q) });

    groups.push({ title: "Categorías", items: getCategories().filter(function(c){
      return paletteMatches(c.name, q);
    }).slice(0, 5).map(function(c){
      return {
        label: c.name,
        meta: c.count + (c.count === 1 ? " enlace" : " enlaces"),
        // Equivale a un clic normal en el lateral: sustituye la selección de
        // categorías (no alterna, porque aquí se ha elegido explícitamente).
        run: function(){
          clearSelectionOnViewChange();
          state.selectedCategories = new Set([c.name]);
          detachActiveView();
          render();
        }
      };
    }) });

    groups.push({ title: "Vistas", items: state.viewProfiles.filter(function(p){
      return paletteMatches(p.name, q);
    }).slice(0, 5).map(function(p){
      return {
        label: p.name,
        // Aplica, nunca alterna: elegir una vista por su nombre no puede
        // significar "deseleccionarla" (misma regla que categorías y etiquetas).
        run: function(){
          clearSelectionOnViewChange();
          applyViewProfile(p);
          render();
        }
      };
    }) });

    // Solo incluir: la paleta no replica el ciclo de tres estados del lateral.
    groups.push({ title: "Etiquetas", items: getAllTags().filter(function(t){
      return paletteMatches(t, q);
    }).slice(0, 5).map(function(t){
      return {
        label: t,
        run: function(){
          clearSelectionOnViewChange();
          state.excludedTags.delete(t);
          state.tags.add(t);
          saveExcludedTags();
          render();
        }
      };
    }) });

    return groups.filter(function(g){ return g.items.length > 0; });
  }

  function paintPalette(){
    var html = "";
    var index = 0;
    paletteItems = [];
    paletteGroups.forEach(function(g){
      html += '<li class="palette-group" role="presentation">' + escapeHtml(g.title) + '</li>';
      g.items.forEach(function(item){
        html += '<li class="palette-item' + (index === paletteHighlightIndex ? ' active' : '') + '"' +
          ' role="option" id="paletteItem-' + index + '" data-index="' + index + '"' +
          (index === paletteHighlightIndex ? ' aria-selected="true"' : '') + '>' +
          '<span class="palette-item-label">' + escapeHtml(item.label) + '</span>' +
          (item.meta ? '<span class="palette-item-meta">' + escapeHtml(item.meta) + '</span>' : '') +
          (item.hint ? '<kbd class="palette-hint">' + escapeHtml(item.hint) + '</kbd>' : '') +
          '</li>';
        paletteItems.push(item);
        index++;
      });
    });
    paletteResultsEl.innerHTML = html;
    paletteResultsEl.hidden = paletteItems.length === 0;
    paletteEmptyEl.hidden = paletteItems.length !== 0;
    paletteInput.setAttribute("aria-expanded", paletteItems.length ? "true" : "false");
    if(paletteItems.length && paletteHighlightIndex >= 0){
      paletteInput.setAttribute("aria-activedescendant", "paletteItem-" + paletteHighlightIndex);
    } else {
      paletteInput.removeAttribute("aria-activedescendant");
    }
  }

  function refreshPalette(){
    paletteGroups = buildPaletteGroups(paletteInput.value);
    var total = paletteGroups.reduce(function(n, g){ return n + g.items.length; }, 0);
    paletteHighlightIndex = total ? 0 : -1;
    paintPalette();
  }

  function movePaletteHighlight(delta){
    if(!paletteItems.length) return;
    paletteHighlightIndex = (paletteHighlightIndex + delta + paletteItems.length) % paletteItems.length;
    paintPalette();
    var active = paletteResultsEl.querySelector(".palette-item.active");
    if(active) active.scrollIntoView({ block: "nearest" });
  }

  // Se cierra antes de ejecutar: la acción puede abrir un modal o enfocar el
  // buscador, y la paleta no debe quedar por medio. El campo se vacía siempre,
  // para que la siguiente apertura empiece limpia.
  function runPaletteItem(item){
    closeCommandPalette();
    item.run();
  }

  function openCommandPalette(){
    paletteInput.value = "";
    paletteOverlay.hidden = false;
    refreshPalette();
    paletteInput.focus();
  }

  function closeCommandPalette(){
    paletteOverlay.hidden = true;
    paletteInput.value = "";
    paletteResultsEl.innerHTML = "";
    paletteGroups = [];
    paletteItems = [];
    paletteHighlightIndex = -1;
    paletteInput.setAttribute("aria-expanded", "false");
    paletteInput.removeAttribute("aria-activedescendant");
  }

  paletteInput.addEventListener("input", refreshPalette);

  paletteInput.addEventListener("keydown", function(e){
    if(e.key === "ArrowDown"){
      e.preventDefault();
      movePaletteHighlight(1);
    } else if(e.key === "ArrowUp"){
      e.preventDefault();
      movePaletteHighlight(-1);
    } else if(e.key === "Enter"){
      e.preventDefault();
      if(paletteHighlightIndex >= 0 && paletteItems[paletteHighlightIndex]){
        runPaletteItem(paletteItems[paletteHighlightIndex]);
      }
    }
    // Escape se deja burbujear: lo cierra el manejador global de overlays.
  });

  paletteResultsEl.addEventListener("click", function(e){
    var li = e.target.closest(".palette-item");
    if(!li) return;
    var item = paletteItems[Number(li.getAttribute("data-index"))];
    if(item) runPaletteItem(item);
  });

  document.getElementById("btnCommandPalette").addEventListener("click", function(){ openCommandPalette(); });

  // A diferencia de "/" y "n", Ctrl+K funciona también con el foco en un campo
  // de texto — es lo esperable de una paleta de comandos. Lo que no hace es
  // abrirse con otro overlay abierto. preventDefault() siempre: en Chrome y
  // Edge, Ctrl+K enfoca la barra de direcciones, y eso tampoco debe pasar
  // cuando la paleta decide no abrirse.
  document.addEventListener("keydown", function(e){
    if((e.key || "").toLowerCase() !== "k") return;
    if(!(e.ctrlKey || e.metaKey) || e.altKey) return;
    e.preventDefault();
    if(anyOverlayOpen()) return;
    openCommandPalette();
  });

  registerOverlay(paletteOverlay, closeCommandPalette);

  // ---------- Inicio ----------
  var stored = load();
  state.links = stored !== null ? stored : [];
  state.categories = loadCategories();
  state.allTags = loadAllTags();
  state.siteTitle = loadSiteTitle();
  state.viewMode = loadViewMode();
  state.collapsedCategories = loadCollapsedCategories();
  state.categoryColors = loadCategoryColors();
  state.categoryIcons = loadCategoryIcons();
  state.tagColors = loadTagColors();
  state.excludedTags = loadExcludedTags();
  state.viewProfiles = loadViewProfiles();

  state.links.forEach(function(l){
    l.category = ensureCategory(l.category);
    l.tags = (l.tags || []).map(ensureTag);
  });

  save();
  saveCategories();
  saveAllTags();
  applySiteTitle();
  renderFooter();
  render();
})();
</script>
